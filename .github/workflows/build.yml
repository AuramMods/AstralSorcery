name: Build

on:
  push:
    branches:
      - 'codex/forge-1.20.1'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build pinned ObserverLib
        run: ./scripts/build-observerlib.sh
      - name: Build Astral Sorcery
        run: ./gradlew build
