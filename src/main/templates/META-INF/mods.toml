mandatory=true
versionRange="${observerlib_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
mandatory=true
versionRange="${curios_version_range}"
ordering="AFTER"
side="BOTH"
