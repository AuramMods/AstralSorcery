plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = "${mod_version}+forge.${minecraft_version}"
group = mod_group_id
base.archivesName = mod_id

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

def gameDir = { String profile -> layout.projectDirectory.dir("run/${profile}").asFile }
def integrationMods = providers.gradleProperty('integrationMods').map { it.toBoolean() }.orElse(false)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory gameDir(name)
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        client2 {
            parent runs.client
            workingDirectory gameDir('client2')
            args '--username', 'Dev2'
        }
        server {
            args '--nogui'
        }
        gameTestServer {}
        data {
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }
}

mixin {
    add sourceSets.main, 'astralsorcery.refmap.json'
    config 'astralsorcery.mixins.json'
}

repositories {
    maven {
        name = 'ObserverLib Forge build'
        url = uri('.gradle/observerlib/maven')
        content { includeModule 'hellfirepvp.observerlib', 'observerlib' }
    }
    maven {
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
    maven {
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

sourceSets.main.resources {
    srcDirs 'src/generated/resources', 'src/main/templates'
    exclude '**/.cache/**'
}

jarJar.enable()

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("hellfirepvp.observerlib:observerlib:${observerlib_version}")
    implementation fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")

    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    compileOnly fg.deobf("maven.modrinth:jade:${jade_version}")
    if (integrationMods.get()) {
        runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
        runtimeOnly fg.deobf("net.mezzdev.config:mezz_config-${minecraft_version}-forge:${mezzconfig_version}")
        runtimeOnly fg.deobf("maven.modrinth:jade:${jade_version}")
    }

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    runtimeOnly "io.github.llamalad7:mixinextras-forge:${mixinextras_version}"
    jarJar("io.github.llamalad7:mixinextras-forge:${mixinextras_version}") {
        jarJar.ranged(it, "[${mixinextras_version},0.6)")
    }
}

// These settings apply only to the isolated ForgeGradle run directories.
def quietClientOptions = ['narrator:0'] + [
        'master', 'music', 'record', 'weather', 'block',
        'hostile', 'neutral', 'player', 'ambient', 'voice'
].collect { "soundCategory_${it}:0.0" }
def quietClientOptionKeys = quietClientOptions.collect { it.substring(0, it.indexOf(':') + 1) }
['client', 'client2'].each { profile ->
    tasks.matching { it.name == "run${profile.capitalize()}" }.configureEach {
        doFirst {
            def options = new File(gameDir(profile), 'options.txt')
            options.parentFile.mkdirs()
            def previous = options.exists() ? options.readLines('UTF-8') : []
            def settings = previous.findAll { line ->
                !quietClientOptionKeys.any { line.startsWith(it) }
            } + quietClientOptions
            options.setText(settings.join('\n') + '\n', 'UTF-8')
        }
    }
}
tasks.matching { it.name == 'runServer' }.configureEach {
    doFirst {
        def eula = new File(gameDir('server'), 'eula.txt')
        eula.parentFile.mkdirs()
        eula.setText('eula=true\n', 'UTF-8')
    }
}

tasks.named('processResources', ProcessResources).configure {
    def metadataKeys = [
            'minecraft_version_range', 'forge_version_range', 'loader_version_range', 'mod_id',
            'mod_name', 'mod_license', 'mod_authors', 'mod_description',
            'observerlib_version_range', 'curios_version_range'
    ]
    def metadata = metadataKeys.collectEntries { [it, project.property(it)] }
    metadata.mod_version = project.version.toString()
    inputs.properties metadata
    filesMatching('META-INF/mods.toml') { expand metadata }
}

tasks.named('jar', Jar).configure {
    manifest.attributes(
            'Implementation-Version': project.version,
            'MixinConfigs': 'astralsorcery.mixins.json'
    )
}

tasks.named('jarJar', Jar).configure {
    archiveClassifier = ''
    finalizedBy 'reobfJarJar'
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('printVersion') {
    doLast { println "version:${project.version}" }
}

idea.module.downloadSources = true
idea.module.downloadJavadoc = true

// Credits: ImmersiveEngineering / and from there: BrainStone
void minimizePNGFile(File file) {
    long size = file.length()
    exec {
        executable "optipng.exe"
        args "-q", "-o7", "-zm1-9", "-strip", "all", file
    }
    long newSize = file.length()
    if (newSize < size) {
        System.out.format("Reduced File size of %s from %d bytes to %d bytes (reduced by %.2f%%)\n",
                file, size, newSize, ((double) (size - newSize)) / ((double) size) * 100.0)
    } else {
        System.out.format("File size of %s couldn't be reduced.\n", file)
    }
}

tasks.register('optimizePng') {
    def pngPatterns = ["**/*.png"]
    doLast {
        for (dir in sourceSets.main.resources.srcDirs) {
            fileTree(dir: dir, includes: pngPatterns).each { minimizePNGFile(it) }
        }
    }
}
